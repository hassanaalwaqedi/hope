# HOPE Backend - Development Docker Configuration
# This file provides local development environment setup
#
# Required environment variables (set in .env file):
#   POSTGRES_USER     - Database user (default: hope_user)
#   POSTGRES_PASSWORD - Database password (REQUIRED)
#   POSTGRES_DB       - Database name (default: hope_db)
#   PGADMIN_DEFAULT_PASSWORD - PGAdmin password (optional, tools profile)

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hope-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hope_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hope_user} -d ${POSTGRES_DB:-hope_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # PGAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hope-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@hope.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # Redis for caching/rate limiting (future use)
  redis:
    image: redis:7-alpine
    container_name: hope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:


networks:
  default:
    name: hope-network
