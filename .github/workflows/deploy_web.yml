name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'hope_mobile/**' # Only trigger if frontend code changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hope_mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        # IMPORTANT: Replace '/hope/' with your repository name if different
        # e.g. --base-href "/my-repo-name/"
        run: flutter build web --release --base-href "/hope/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hope_mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
